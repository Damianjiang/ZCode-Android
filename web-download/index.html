<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zemote 下载</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0f1a;
            color: #f5f0e8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #161828;
            border-radius: 24px;
            padding: 32px 28px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #1A73E8, #4FC3F7);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .ver { color: #a8b4c8; font-size: 13px; margin-bottom: 24px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #1A73E8;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .hint { margin-top: 16px; font-size: 12px; color: #a8b4c8; line-height: 1.6; }
        .size { color: #4FC3F7; font-size: 13px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📱</div>
        <h1>Zemote</h1>
        <p class="ver">ZCode 远程控制客户端 · v1.1.0</p>
        <a class="btn" href="https://github.com/Damianjiang/zemote-android/releases/latest/download/app-debug.apk" id="dlBtn">
            下载 APK（18 MB）
        </a>
        <p class="size" id="sizeHint">点击即可开始下载</p>
        <p class="hint">
            下载完成后打开安装即可<br>
            如遇提示请选择"允许安装未知应用"
        </p>
    </div>
</body>
</html>
